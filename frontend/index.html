<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Arizona_Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Arizona Sunshine</title>
    <style>
      /* Disable text selection */
      body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
      /* Allow selection in input fields */
      input, textarea { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Security Protection Layer - runs immediately before React loads
      (function() {
        'use strict';

        // Helper to block event
        function blockEvent(e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return false;
        }

        // Disable right-click context menu - use capture phase (true) for priority
        document.addEventListener('contextmenu', blockEvent, true);
        window.addEventListener('contextmenu', blockEvent, true);

        // Disable keyboard shortcuts for DevTools and View Source
        function handleKeyDown(e) {
          var key = e.key || '';
          var keyCode = e.keyCode || 0;
          var ctrl = e.ctrlKey || e.metaKey;
          var shift = e.shiftKey;

          // F12 - DevTools
          if (key === 'F12' || keyCode === 123) return blockEvent(e);
          // Ctrl+Shift+I - DevTools
          if (ctrl && shift && (key === 'I' || key === 'i' || keyCode === 73)) return blockEvent(e);
          // Ctrl+Shift+J - Console
          if (ctrl && shift && (key === 'J' || key === 'j' || keyCode === 74)) return blockEvent(e);
          // Ctrl+Shift+C - Element Inspector
          if (ctrl && shift && (key === 'C' || key === 'c' || keyCode === 67)) return blockEvent(e);
          // Ctrl+U - View Source
          if (ctrl && (key === 'U' || key === 'u' || keyCode === 85)) return blockEvent(e);
          // Ctrl+S - Save Page
          if (ctrl && (key === 'S' || key === 's' || keyCode === 83)) return blockEvent(e);
          // Ctrl+P - Print
          if (ctrl && (key === 'P' || key === 'p' || keyCode === 80)) return blockEvent(e);
        }
        document.addEventListener('keydown', handleKeyDown, true);
        window.addEventListener('keydown', handleKeyDown, true);

        // Detect DevTools opening
        var devtools = { open: false };
        var threshold = 160;
        setInterval(function() {
          var widthDiff = window.outerWidth - window.innerWidth > threshold;
          var heightDiff = window.outerHeight - window.innerHeight > threshold;
          if (widthDiff || heightDiff) {
            if (!devtools.open) {
              devtools.open = true;
              console.clear();
              console.log('%cStop!', 'color: red; font-size: 50px; font-weight: bold;');
              console.log('%cThis browser feature is intended for developers.', 'font-size: 18px;');
            }
          } else {
            devtools.open = false;
          }
        }, 500);

        // Disable drag and drop
        document.addEventListener('dragstart', blockEvent, true);

        // Disable copy (except in input fields)
        document.addEventListener('copy', function(e) {
          var tag = e.target.tagName;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') return blockEvent(e);
        }, true);

        // Disable text selection (except in input fields)
        document.addEventListener('selectstart', function(e) {
          var tag = e.target.tagName;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') return blockEvent(e);
        }, true);

        // Clear console periodically
        setInterval(function() { console.clear(); }, 1000);

        // Additional protection: override right-click on document ready
        document.oncontextmenu = function() { return false; };
      })();
    </script>
  </body>
</html>
